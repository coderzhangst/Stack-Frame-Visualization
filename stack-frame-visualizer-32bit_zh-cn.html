    call twice

    leave

    mov qword ptr [rbp-8], 7
    mov rdi, [rbp-8]
    call twice

    mov rax, rdi
    add rax, rax

    ret

    movq %rsp, %rbp
    movq $5, %rdi
    call factorial
    leave
    ret

    pushq %rbp
    movq %rsp, %rbp
    subq $16, %rsp
    movq %rdi, -8(%rbp)
    cmpq $1, %rdi
    jle .Lbase
    subq $1, %rdi
