; each stack cell is 4 bytes; [a]/[b]/[result] are global variables (zero-initialized)
main:
    push        ebp
    mov         ebp,esp
    sub         esp,44h        ; locals: 68 bytes = 17 cells
    push        ebx            ; save callee-saved registers
    push        esi
    push        edi
    mov         dword ptr [a],1 ; initialize globals so the eax change is visible
    mov         dword ptr [b],2
    push        2              ; argument b
    push        1              ; argument a
    call        func
    add         esp,8           ; cdecl: caller cleans the stack
    mov         dword ptr [result],eax
    xor         eax,eax         ; return value 0
    pop         edi
    pop         esi
    pop         ebx
    mov         esp,ebp
    pop         ebp
    ret
func:
    push        ebp
    mov         ebp,esp
    sub         esp,40h        ; locals: 64 bytes = 16 cells
    mov         eax,dword ptr [a]
    add         eax,dword ptr [b]
    mov         esp,ebp
    pop         ebp
    ret
